---
# GitHub Actions syntax: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: CI
"on":
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
concurrency:
  group: ${{ github.event_name }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  MegaLinter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oxsecurity/megalinter/flavors/cupcake@v8.4.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload MegaLinter artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
      - name: Upload MegaLinter scan results to GitHub Security tab
        if: always() && !cancelled()
        uses: github/codeql-action/upload-sarif@v3.28.12
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
  trunk_check:
    name: Trunk Code Quality Check
    runs-on: ubuntu-latest
    permissions:
      # For trunk to post annotations
      checks: write
      # For repo checkout
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@v1.1.19
  BuildAndPublish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: earthly/actions-setup@v1.0.13
        with:
          version: latest
      - name: Run build
        run: |
          earthly +all
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          earthly --push --secret CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" --secret CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" +publish
