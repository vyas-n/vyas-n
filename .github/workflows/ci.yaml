---
# GitHub Actions syntax: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: CI
"on":
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
concurrency:
  group: ${{ github.event_name }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  MegaLinter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oxsecurity/megalinter/flavors/cupcake@v8.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload MegaLinter artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
      - name: Upload MegaLinter scan results to GitHub Security tab
        if: always() && !cancelled()
        uses: github/codeql-action/upload-sarif@v3.28.18
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
  BuildContainer:
    # TODO: fix docker builds
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    outputs:
      version: ${{ steps.semver.outputs.version }}
      meta_json: ${{ steps.meta.outputs.json }}
    steps:
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
        with:
          cleanup: false
      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1.10.1
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        with:
          token: ${{ github.token }}
          branch: ${{ github.event.repository.default_branch }} # TODO: fix so that this works for cron
          # Config based on https://www.conventionalcommits.org/en/v1.0.0/
          patchList: fix, bugfix, perf, refactor, test, tests, build, chore, ci, docs, style, patch, bug
      - uses: docker/metadata-action@v5.7.0
        id: meta
        with:
          images: |
            ghcr.io/vyas-n/vyas-n
          annotations: |
            org.opencontainers.image.title='Vyas\'s Website'
            org.opencontainers.image.description='This is Vyas\'s Website packaged into a Docker container.'
          labels: |
            org.opencontainers.image.title='Vyas\'s Website'
            org.opencontainers.image.description='This is Vyas\'s Website packaged into a Docker container.'
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}},value=${{ steps.semver.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.semver.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch }}
      - uses: docker/build-push-action@v6.17.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  BuildAndPublish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6.1.3
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.*', '**/*.rs', '**/package.json', '**/package-lock.json', '**/*.toml', '**/*.html') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 5G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or, last accessed more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: 0
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never
      - name: Build code
        run: |
          nix build
      - name: Check if run targets work
        run: |
          nix run .#wrangler -- --help
          nix run .#trunk -- --help
      - name: Publish
        run: |
          env CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }} nix run .#wrangler -- pages publish --project-name vyas-n --branch "$(git branch --show-current)" ./result
